<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori Kelas - E-Library MTs Al-Falah Klender</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside id="sidebar"></aside>

    <!-- Main Canvas -->
    <div class="main-wrapper">
      <header id="top-header"></header>

      <main class="page-content">
        <!-- Toolbar & Filter -->
        <div class="page-toolbar">
          <div class="search-box">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="search-input" class="search-input" placeholder="Cari nama kelas atau wali kelas..." oninput="filterData()">
          </div>
          <div class="filter-group">
            <button class="btn btn-primary" onclick="openTambahModal()">
              <span class="material-symbols-outlined">add</span>
              <span>Tambah Kelas</span>
            </button>
          </div>
        </div>

        <!-- Tabel Data -->
        <div class="table-card">
          <div class="table-responsive">
            <table class="data-table master-kelas-table">
              <thead>
                <tr>
                  <th style="width: 60px; text-align: center;">No</th>
                  <th>Nama Kelas / Rombel</th>
                  <th>Tingkat</th>
                  <th>Wali Kelas</th>
                  <th style="width: 140px; text-align: center;">Aksi</th>
                </tr>
              </thead>
              <tbody id="table-body">
                <tr>
                  <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 32px;">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Tambah / Edit Kelas -->
  <div id="modal-form" class="modal-overlay">
    <div class="modal-box modal-box-sm">
      <div class="modal-header">
        <h3 id="modal-title">
          <span class="material-symbols-outlined" style="color: var(--primary);">meeting_room</span>
          <span>Tambah Kategori Kelas</span>
        </h3>
        <button class="modal-close-btn" onclick="closeModal('modal-form')">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="form-kelas" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="kelas-id">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="tingkat-kelas">Tingkat Kelas <span class="req">*</span></label>
            <select id="tingkat-kelas" class="form-control" required>
              <option value="">Pilih Tingkat</option>
              <option value="VII">Kelas VII</option>
              <option value="VIII">Kelas VIII</option>
              <option value="IX">Kelas IX</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="nama-kelas">Nama Kelas / Rombel <span class="req">*</span></label>
            <input type="text" id="nama-kelas" class="form-control" placeholder="Contoh: VII-A, VIII-B, IX-C" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="wali-kelas">Wali Kelas</label>
            <input type="text" id="wali-kelas" class="form-control" placeholder="Contoh: Dra. Hj. Siti Maryam, M.Pd">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-form')">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Hapus -->
  <div id="modal-hapus" class="modal-overlay">
    <div class="modal-box modal-box-sm">
      <div class="modal-header">
        <h3 style="color: var(--error);">
          <span class="material-symbols-outlined">delete</span>
          <span>Hapus Kelas</span>
        </h3>
        <button class="modal-close-btn" onclick="closeModal('modal-hapus')">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <p>Apakah Anda yakin ingin menghapus kelas <strong id="hapus-nama" style="color: var(--text-primary);">-</strong>?</p>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">Pastikan tidak ada data siswa terkait.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-hapus')">Batal</button>
        <button type="button" class="btn btn-danger" id="btn-konfirmasi-hapus">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <!-- Modal Logout -->
  <div id="modal-logout" class="modal-overlay">
    <div class="modal-box modal-box-sm">
      <div class="modal-header">
        <h3 style="color: var(--error);">
          <span class="material-symbols-outlined">logout</span>
          <span>Konfirmasi Logout</span>
        </h3>
        <button class="modal-close-btn" onclick="closeModal('modal-logout')">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <p>Apakah Anda yakin ingin mengakhiri sesi Administrator?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-logout')">Batal</button>
        <button type="button" class="btn btn-danger" onclick="confirmLogout()">Ya, Keluar</button>
      </div>
    </div>
  </div>

  <script src="../js/admin-common.js"></script>
  <script src="../js/kategori-kelas.js"></script>
</body>
</html>
