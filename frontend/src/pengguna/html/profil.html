<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya — E-Library MTs Al-Falah Klender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="../css/user.css">
</head>
<body>
  <header id="user-nav" class="user-nav"></header>

  <main class="main">
    <div class="section-header"><h1>Profil Saya</h1><span class="text-muted">Kelola informasi akun dan keamanan Anda.</span></div>
    <div class="profile-layout">
      <section class="card profile-summary"><img id="profile-pic" src="../../../assset/iconpengguna.svg" alt="Foto profil"><h2 id="user-name">-</h2><p id="user-role">-</p><dl><div><dt>Identifier</dt><dd id="user-email">-</dd></div><div><dt>Kelas</dt><dd id="user-kelas">-</dd></div><div><dt>Status</dt><dd><span id="user-status" class="status">-</span></dd></div></dl></section>
      <div class="profile-forms"><section class="card form-card"><h2>Informasi dasar</h2><p class="card-intro">Nama dan email dipakai untuk mengenali akun Anda.</p><label class="form-label" for="edit-name">Nama lengkap</label><input id="edit-name" class="form-input" type="text"><label class="form-label" for="edit-email">Email</label><input id="edit-email" class="form-input" type="email" placeholder="Belum diisi"><button id="save-profile" class="btn btn-primary">Simpan</button></section><section class="card form-card"><h2>Ganti kata sandi</h2><p class="card-intro">Gunakan sedikitnya 8 karakter, terdiri dari huruf dan angka.</p><form id="change-password-form" onsubmit="return false"><label class="form-label" for="current-password">Kata sandi saat ini</label><input id="current-password" class="form-input" type="password"><label class="form-label" for="new-password">Kata sandi baru</label><input id="new-password" class="form-input" type="password"><label class="form-label" for="confirm-password">Ulangi kata sandi baru</label><input id="confirm-password" class="form-input" type="password"><button id="save-password" class="btn btn-primary">Ganti Kata Sandi</button></form></section></div>
    </div>
  </main>

  <div id="user-toast"></div>

  <script src="../js/user-common.js"></script>
  <script src="../js/profil.js"></script>
</body>
</html>
